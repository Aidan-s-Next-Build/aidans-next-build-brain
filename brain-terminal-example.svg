<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Example content brain terminal output</title>
  <desc id="desc">A presentation mockup of a proposed terminal command that returns three ranked video ideas, their reasoning, rough forecast confidence, and a prompt to record the user's choice. The example ideas and scores are illustrative, not output from the current scripts.</desc>
  <defs>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" /></filter>
    <style>
      .mono { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .dim { fill: #7d8798; }
      .white { fill: #f5f7fb; }
      .blue { fill: #6f96ff; }
      .green { fill: #7ee0b1; }
      .yellow { fill: #f0c779; }
      .muted { fill: #bdc5d2; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#07090d" />
  <circle cx="1450" cy="110" r="180" fill="#376cff" opacity=".055" filter="url(#soft-glow)" />
  <rect x="72" y="60" width="1456" height="880" rx="12" fill="#0c0f14" stroke="#29313d" stroke-width="2" />
  <path d="M84 60h1432a12 12 0 0 1 12 12v54H72V72a12 12 0 0 1 12-12Z" fill="#151a22" />
  <path d="M72 126h1456" stroke="#29313d" stroke-width="2" />

  <circle cx="104" cy="91" r="8" fill="#ff6259" />
  <circle cx="132" cy="91" r="8" fill="#f4bd4f" />
  <circle cx="160" cy="91" r="8" fill="#45c75a" />
  <text x="800" y="98" text-anchor="middle" class="mono dim" font-size="18">content-brain / example run</text>
  <rect x="1338" y="77" width="150" height="28" rx="14" fill="#202b42" />
  <text x="1413" y="97" text-anchor="middle" class="mono blue" font-size="13" font-weight="700" letter-spacing="1">MOCK OUTPUT</text>

  <g class="mono" font-size="19">
    <text x="112" y="178" class="green">$</text>
    <text x="137" y="178" class="white">brain recommend "growth engineering careers"</text>

    <text x="112" y="224" class="dim">Loading channel profile and current patterns...</text>
    <text x="112" y="254" class="green">OK</text>
    <text x="154" y="254" class="muted">Loaded</text>
    <text x="246" y="254" class="white">channel-profile.md</text>
    <text x="470" y="254" class="dim">and</text>
    <text x="510" y="254" class="white">winning-patterns.md</text>

    <text x="112" y="300" class="dim">Checking performance context...</text>
    <text x="112" y="330" class="muted">YouTube videos: </text>
    <text x="290" y="330" class="yellow">4 real examples</text>
    <text x="470" y="330" class="dim">|</text>
    <text x="495" y="330" class="muted">Synthetic examples: </text>
    <text x="725" y="330" class="dim">excluded</text>
    <text x="835" y="330" class="dim">|</text>
    <text x="860" y="330" class="muted">Forecast confidence: </text>
    <text x="1108" y="330" class="yellow">LOW</text>

    <text x="112" y="384" class="blue" font-weight="700">IDEAS TO CONSIDER</text>
    <path d="M112 402h1376" stroke="#29313d" />

    <text x="112" y="444" class="blue" font-weight="700">01</text>
    <text x="160" y="444" class="white" font-weight="700">What Growth Engineer Job Posts Actually Ask For</text>
    <text x="160" y="475" class="muted">CORE</text>
    <text x="238" y="475" class="dim">Hiring-focused; fits your recent career videos.</text>
    <text x="160" y="506" class="dim">Evidence: 2 similar videos; results varied widely.</text>

    <text x="112" y="560" class="blue" font-weight="700">02</text>
    <text x="160" y="560" class="white" font-weight="700">Build a Portfolio Project That Shows Growth Engineering</text>
    <text x="160" y="591" class="muted">ADJACENT</text>
    <text x="282" y="591" class="dim">A practical build with a portfolio-ready result.</text>
    <text x="160" y="622" class="dim">Evidence: few direct comparisons; estimate is tentative.</text>

    <text x="112" y="676" class="blue" font-weight="700">03</text>
    <text x="160" y="676" class="white" font-weight="700">I Treated My Channel Like a Growth Experiment</text>
    <text x="160" y="707" class="muted">WILDCARD</text>
    <text x="282" y="707" class="dim">A personal experiment beyond the career niche.</text>
    <text x="160" y="738" class="dim">Evidence: no close match; try it as a creative test.</text>

    <path d="M112 766h1376" stroke="#29313d" />
    <text x="112" y="808" class="yellow">Note: forecasts are rough examples, not promises.</text>
    <text x="112" y="840" class="dim">The current export does not isolate first-7-day views.</text>

    <rect x="112" y="866" width="1376" height="48" rx="6" fill="#111a2b" stroke="#274a9d" />
    <text x="134" y="897" class="blue" font-weight="700">YOUR MOVE</text>
    <text x="260" y="897" class="white">Choose 1, edit a title, or pass on all 3.</text>
    <text x="900" y="897" class="dim">Next: save your choice to guide future rankings.</text>
  </g>

  <text x="80" y="974" class="mono dim" font-size="13">Presentation mockup only. Example titles and wording are illustrative, not current script output.</text>
  <text x="1520" y="974" text-anchor="end" class="mono dim" font-size="13">PROFOUND BLUE  #376CFF</text>
</svg>
